# ════════════════════════════════════════════════════════════════════════
#  CrowdWisdomTrading — Macro-Event ML Pipeline configuration
#  All tunables live here. Secrets live in .env (never in this file).
# ════════════════════════════════════════════════════════════════════════

seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  database: data/processed/pipeline.db
  reports: reports
  figures: reports/figures

# ── Stage 1: Macro event ingestion ──────────────────────────────────────
macro:
  lookback_days: 180              # per the CWT brief ("last 180 days")
  country: United States
  apify:
    # The economic-calendar actor is DISCOVERED at runtime via the Apify
    # Store API (search below). The chosen id is written back here and
    # logged, so the exact actor used is recorded (no invented IDs).
    actor_id: null                # auto-filled on first live run (or set manually)
    store_search: "economic calendar"
    memory_mbytes: 2048
    timeout_secs: 300
  # Keyword map used to classify scraped rows into high-impact US event types.
  event_types:
    CPI:      ["cpi", "consumer price index", "inflation rate"]
    FOMC:     ["fomc", "federal funds", "interest rate decision", "fed interest rate", "fed press conference", "fed statement", "fomc economic projections"]
    NFP:      ["non-farm", "nonfarm", "nfp", "payrolls"]
    UNEMP:    ["unemployment rate"]
    JOBLESS:  ["jobless claims", "initial claims", "continuing claims"]
  impact_levels: ["high"]         # keep high-impact only

news:
  tavily:
    queries:
      - "Federal Reserve interest rate policy decision"
      - "US inflation CPI consumer price index report"
      - "US jobs report nonfarm payrolls unemployment"
      - "FOMC meeting rate cut hike outlook"
    max_results: 20
    search_depth: advanced
    days: 180
  exa:
    enabled: false                # optional 3rd source (set EXA_API_KEY to enable)
    queries:
      - "Federal Reserve monetary policy outlook"
      - "US labor market inflation trend"
    num_results: 15

# ── Stage 2: Trade generation (stand-in strategy backtest) ──────────────
trades:
  symbols: ["SPY", "QQQ", "TLT", "GLD"]
  price_history_days: 1095        # ~3y, > macro window, for indicator warm-up
  initial_capital: 100000
  risk_per_trade: 0.02            # fraction of capital risked per position
  families:
    ma_crossover:
      fast: [10, 20]
      slow: [50, 100, 200]
      atr_stop_mult: [2.0, 3.0]
      atr_window: 14
    breakout:
      lookback: [20, 55]
      stop_pct: [0.01, 0.02]
      take_profit_pct: [0.02, 0.04]

# ── Stage 3: Feature engineering / period definition ────────────────────
features:
  period: "W"                     # pandas offset alias: W = weekly periods
  event_window_hours: 2           # +/-2h event-window flag (FOMC/CPI/NFP)
  rolling_surprise_window: 3      # past events only
  rolling_perf_window: 4          # past periods only (lagged)
  sentiment_roll_days: 7

# ── Stage 4: Walk-forward validation + model ────────────────────────────
walkforward:
  min_train_periods: 8            # expanding-window start size
  embargo_periods: 1              # purge/embargo gap between train and test
  purge: true
  top_k: [1, 3]                   # number of permutations selected per period
model:
  type: lightgbm                  # falls back to sklearn HistGradientBoosting
  target: pnl                     # 'pnl' (regression) primary; 'winrate' secondary
  lightgbm:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    max_depth: 4
    min_child_samples: 10
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0

# ── Stage 5: Evaluation ─────────────────────────────────────────────────
evaluation:
  periods_per_year: 52            # weekly periods -> sqrt(52) annualisation
  risk_free_rate: 0.0
